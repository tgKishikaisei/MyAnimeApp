<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>You're Offline — AniFlow</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #000;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
            padding: 2rem;
        }
        .container { max-width: 400px; }
        .icon { font-size: 4rem; margin-bottom: 1.5rem; }
        h1 { font-size: 1.75rem; font-weight: 800; margin-bottom: 0.75rem; }
        p  { color: #666; font-size: 0.95rem; line-height: 1.6; margin-bottom: 2rem; }
        button {
            background: #2563eb;
            color: #fff;
            border: none;
            padding: 0.75rem 2rem;
            border-radius: 0.75rem;
            font-size: 0.9rem;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover { background: #3b82f6; }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">📡</div>
        <h1>You're offline</h1>
        <p>AniFlow needs an internet connection to load new content. Previously visited pages are still available from cache.</p>
        <button onclick="window.location.reload()">Try again</button>
    </div>
</body>
</html>
