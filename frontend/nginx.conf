# Отдаёт SPA и проксирует /api, /static на backend (один origin — refresh-cookie
# SameSite=Strict работает без CORS). TLS терминируется перед этим контейнером
# (Caddy/Traefik/nginx на хосте или балансировщик), поэтому HSTS ставит он.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 8080;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;

    # Видео до 500 МБ грузятся только на /api/v1/clips/upload (см. ниже).
    client_max_body_size 12m;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    # ── Заголовки безопасности ──────────────────────────────────────────────
    # add_header наследуется только если в location нет своих add_header,
    # поэтому общий набор вынесен в include и подключается в каждом location.
    set $csp "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; media-src 'self' blob:; connect-src 'self' https://*.sentry.io https://*.ingest.sentry.io https://*.ingest.de.sentry.io; frame-src https://www.youtube.com https://www.youtube-nocookie.com; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'";

    location = /index.html {
        add_header Content-Security-Policy $csp always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), browsing-topics=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        # HTML не кэшируем: после деплоя браузер должен увидеть новые хэши ассетов.
        add_header Cache-Control "no-cache" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Content-Security-Policy $csp always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), browsing-topics=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
    }

    # Ассеты Vite с хэшем в имени — кэш навсегда.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location = /sw.js {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # ── Прокси на API ───────────────────────────────────────────────────────
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # ПЕРЕЗАПИСЫВАЕМ X-Forwarded-For адресом клиента, а не дописываем к
        # присланному: иначе клиент подставит любой IP и обойдёт rate limit.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 120s;
    }

    # Загрузка видео — единственное место с большим телом запроса.
    location = /api/v1/clips/upload {
        client_max_body_size 510m;
        proxy_request_buffering off;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
    }

    # Медиа из backend/static. Отдельная жёсткая CSP + nosniff: даже если в
    # static окажется HTML/SVG, браузер его не исполнит.
    location /static/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_hide_header Content-Security-Policy;
        add_header Content-Security-Policy "default-src 'none'; img-src 'self'; media-src 'self'; sandbox" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "public, max-age=86400" always;
    }

    # Служебные эндпоинты наружу не публикуем.
    location ~ ^/(metrics|docs|redoc|openapi\.json)$ {
        return 404;
    }
}
