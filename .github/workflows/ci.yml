name: CI

on:
  push:
    branches: [main, master, development]
  pull_request:

# Минимальные права токена: CI только читает репозиторий.
permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: aniflow
          POSTGRES_PASSWORD: aniflow_test_pw
          POSTGRES_DB: aniflow_test
        ports: ["55432:5432"]
        options: >-
          --health-cmd "pg_isready -U aniflow" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://aniflow:aniflow_test_pw@127.0.0.1:55432/aniflow_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install (hash-pinned)
        run: pip install --require-hashes -r requirements-dev.txt -r requirements.txt
      - name: Ruff (ошибки, не стиль)
        run: ruff check app --select F821,F811,E9,B006
      - name: Bandit (Medium+ блокирует)
        run: bandit -r app -ll
      - name: pip-audit (известные CVE в зависимостях)
        run: pip-audit -r requirements.txt --no-deps --disable-pip --strict
      - name: Migrations round-trip on empty DB
        env:
          DATABASE_URL: postgresql+asyncpg://aniflow:aniflow_test_pw@127.0.0.1:55432/aniflow_test
          ENV: development
          PROJECT_NAME: CI
          SECRET_KEY: ci-only-not-a-real-secret-0123456789abcdef
        run: |
          alembic upgrade head
          alembic check
          alembic downgrade base
      - name: Pytest
        run: python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install (lockfile, без install-скриптов)
        run: npm ci --ignore-scripts
      - name: npm audit (high+ блокирует)
        run: npm audit --audit-level=high
      - name: Provenance подписи пакетов
        run: npm audit signatures
      - name: Type-check
        run: npx tsc -p tsconfig.app.json --noEmit
      - name: ESLint (ошибки блокируют; 106 → 0 в 2026-09)
        run: npx eslint . --max-warnings 13
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build
      - name: No source maps / localhost URLs in bundle
        run: |
          ! find dist -name '*.map' | grep .
          ! grep -rE "localhost:8000|127\.0\.0\.1:8000" dist

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build images
        run: |
          docker build -t aniflow-backend:ci ./backend
          docker build -t aniflow-frontend:ci ./frontend
      - name: Trivy (Critical/High блокирует)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: aniflow-backend:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks (вся история)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
